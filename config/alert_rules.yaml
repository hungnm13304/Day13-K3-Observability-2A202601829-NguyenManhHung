alerts:
  - name: HighResponseLatency
    severity: critical
    condition: 'latency_p95_ms > 3000 for 5m'
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: high
    condition: 'error_rate_pct > 2 for 5m'
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: QualityOrCostDegradation
    severity: warning
    condition: 'quality_score_avg < 0.75 for 10m OR daily_cost_usd > 2.5'
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
